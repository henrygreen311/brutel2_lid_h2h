name: btc-export

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: export, finalize, or status"
        required: true
        default: "export"
        type: choice
        options: [export, finalize, status]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Log runner resources
        run: |
          echo "--- CPU ---"
          nproc
          echo "--- RAM ---"
          free -h
          echo "--- Disk ---"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BTC exporter
        env:
          PYTHONUNBUFFERED: "1"
          MODE: ${{ github.event.inputs.mode || 'export' }}
        run: |
          if [ "$MODE" = "finalize" ]; then
            python3 main.py --finalize --cleanup
          elif [ "$MODE" = "status" ]; then
            python3 main.py --status
          else
            python3 main.py
          fi
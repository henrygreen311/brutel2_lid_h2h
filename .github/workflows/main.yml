name: eth-export

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-eth-export]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install \
            google-cloud-bigquery \
            google-auth \
            google-api-python-client \
            supabase

      - name: Run ETH exporter
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 main.py
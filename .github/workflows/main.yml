name: btc-export

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: export (build DB), finalize (dump .txt + delete DB), status"
        required: true
        default: "finalize"
        type: choice
        options: [export, finalize, status]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Log runner resources (before)
        run: |
          echo "--- CPU ---"
          nproc
          echo "--- RAM ---"
          free -h
          echo "--- Disk ---"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log runner resources (after install)
        run: |
          echo "--- RAM ---"
          free -h
          echo "--- Disk ---"
          df -h

      - name: Run BTC exporter
        env:
          PYTHONUNBUFFERED: "1"
          MODE: ${{ inputs.mode }}
        run: |
          echo "Selected mode: $MODE"
          case "$MODE" in
            finalize)
              python3 main.py --finalize --cleanup
              ;;
            status)
              python3 main.py --status
              ;;
            export|*)
              python3 main.py
              ;;
          esac

      - name: Log runner resources (after run)
        if: always()
        run: |
          echo "--- RAM ---"
          free -h
          echo "--- Disk ---"
          df -h